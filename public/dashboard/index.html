<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OmniBot Dashboard</title>
</head>
<body>
<div id="boot" style="font-family:system-ui;background:#0b0d12;color:#e8eaed;min-height:100vh;display:grid;place-items:center;padding:1.5rem">
Loading dashboard…
</div>
<script type="module">
const n = 3;
try {
  const parts = await Promise.all(
    Array.from({ length: n }, (_, i) =>
      fetch('/assets/htmlparts/h' + i + '.txt').then(async (r) => {
        if (!r.ok) throw new Error('Failed to load part h' + i + ' (' + r.status + ')');
        return r.text();
      })
    )
  );
  const bin = Uint8Array.from(atob(parts.join('')), (c) => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
} catch (err) {
  document.getElementById('boot').innerHTML =
    '<div><h1>Dashboard failed to load</h1><pre>' +
    String(err && err.message ? err.message : err) +
    '</pre><p>Pull latest OmniBot and hard-refresh.</p></div>';
}
</script>
</body>
</html>
