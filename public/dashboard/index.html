<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniBot Dashboard</title>
    <link rel="stylesheet" href="/assets/index-B75IN09f.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const n = 8;
      const parts = Array.from({ length: n }, (_, i) => `/assets/parts/p${i}.txt`);
      try {
        const texts = await Promise.all(
          parts.map(async (p) => {
            const r = await fetch(p);
            if (!r.ok) throw new Error('Failed to load ' + p + ' (' + r.status + ')');
            return r.text();
          })
        );
        const blob = new Blob(texts, { type: 'text/javascript' });
        await import(URL.createObjectURL(blob));
      } catch (err) {
        console.error(err);
        document.getElementById('root').innerHTML =
          '<div style="font-family:system-ui;padding:2rem;background:#0f1117;color:#e8eaed;min-height:100vh">' +
          '<h1>Dashboard failed to load</h1><pre>' +
          String(err && err.message ? err.message : err) +
          '</pre><p>Missing assets under /assets/parts/. Sync the Vite build into public/dashboard.</p></div>';
      }
    </script>
  </body>
</html>
