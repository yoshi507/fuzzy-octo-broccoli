<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OmniBot Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg"/>
<style>
:root{--bg:#0b0d12;--panel:#12151c;--panel2:#181c27;--border:#2a3142;--text:#e8eaed;--muted:#9aa3b5;--accent:#5865F2;--accent2:#4752c4;--ok:#3ba55d;--warn:#faa81a;--err:#ed4245;--radius:12px;--shadow:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}button,input,select,textarea{font:inherit}
.btn{appearance:none;border:0;border-radius:10px;padding:.7rem 1.1rem;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn.ghost:hover{border-color:#4a5568}
.btn.danger{background:var(--err)}.btn.sm{padding:.4rem .75rem;font-size:.875rem}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem;font-weight:700;font-size:1.15rem}
.brand .logo{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#000;flex-shrink:0}.brand .logo img{width:100%;height:100%;object-fit:cover;display:block}.login-logo{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 1rem;background:#000;box-shadow:0 0 32px rgba(88,101,242,.35)}.login-logo img{width:100%;height:100%;object-fit:cover;display:block}
.nav{display:flex;flex-direction:column;gap:.25rem;flex:1}
.nav button{text-align:left;background:transparent;border:0;color:var(--muted);padding:.65rem .8rem;border-radius:8px;cursor:pointer}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
.main{padding:1.5rem;max-width:1100px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card h2{margin:0 0 .35rem;font-size:1.15rem}.card p.help{margin:0 0 1rem;color:var(--muted);font-size:.9rem;line-height:1.45}
.field{margin-bottom:.85rem}.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.35rem}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.65rem .75rem}
.field textarea{min-height:96px;resize:vertical}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid rgba(42,49,66,.55)}
.switch:last-child{border-bottom:0}.row{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .55rem;border-radius:999px;background:var(--panel2);border:1px solid var(--border);font-size:.8rem}
.pill.ok{border-color:rgba(59,165,93,.45);color:var(--ok)}.pill.err{border-color:rgba(237,66,69,.45);color:var(--err)}
.center{min-height:100vh;display:grid;place-items:center;padding:1.5rem}.login-card{width:min(420px,100%);text-align:left}
.guild{display:flex;gap:.85rem;align-items:center;padding:.85rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.65rem;cursor:pointer;background:var(--panel)}
.guild:hover{border-color:var(--accent)}.guild img{width:42px;height:42px;border-radius:50%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:.85rem}.stat strong{display:block;font-size:1.25rem;margin-top:.25rem}
.site-footer{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.85rem}
.status{color:var(--muted);font-size:.85rem}
.toast{position:fixed;right:1rem;bottom:1rem;background:var(--panel2);border:1px solid var(--border);padding:.75rem 1rem;border-radius:10px;z-index:50;max-width:min(360px,92vw);box-shadow:var(--shadow)}
.toast.ok{border-color:rgba(59,165,93,.45)}.toast.err{border-color:rgba(237,66,69,.45)}
.hidden{display:none!important}
.nav-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.5rem 0 .25rem;padding:0 .8rem}
#main-panel{min-height:200px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}.grid2{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="card login-card"><p class="help">Loading OmniBot…</p></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/dashboard.js?v=20260822a"></script>
<script src="/dashboard-app.js?v=20260822a"></script>
<script src="/dash-advisor.js?v=20260822a"></script>
<script src="/advertise-page.js?v=20260821c"></script>
<script src="/nav-fix.js?v=20260821c"></script>
<script src="/idle-opt.js?v=1"></script>
</body>
</html>
